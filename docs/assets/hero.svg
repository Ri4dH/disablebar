<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="Animation: a flickering Touch Bar is switched off by DisableBar, then ghost touches are blocked">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262626"/>
      <stop offset="1" stop-color="#111111"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#ff705d" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff705d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#303030"/>
      <stop offset="1" stop-color="#1b1b1b"/>
    </linearGradient>
    <linearGradient id="barEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="onGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f1f1"/>
      <stop offset="1" stop-color="#f1f1f1"/>
    </linearGradient>
    <linearGradient id="offGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#525252"/>
      <stop offset="1" stop-color="#525252"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="barClip"><rect x="130" y="128" width="700" height="48" rx="9"/></clipPath>
    <style>
      text { font-family: Figtree, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif; }
      .cycle { animation-duration: 8s; animation-iteration-count: infinite; animation-timing-function: linear; }

      /* Touch Bar content: flickers, then switches off */
      .tbOn { animation-name: tbOn; }
      @keyframes tbOn {
        0% {opacity:1} 7% {opacity:1} 7.5% {opacity:.25} 8% {opacity:1} 8.6% {opacity:.1} 9.2% {opacity:1}
        19% {opacity:1} 19.5% {opacity:.3} 20.2% {opacity:1}
        31% {opacity:1} 31.4% {opacity:0} 32% {opacity:.9} 32.5% {opacity:.2} 33.2% {opacity:1}
        45% {opacity:1} 50% {opacity:0} 92% {opacity:0} 96% {opacity:1} 100% {opacity:1}
      }
      .glitch { animation-name: glitch; }
      @keyframes glitch {
        0%, 7.4% {opacity:0} 7.5% {opacity:.9} 8.5% {opacity:0}
        31.3% {opacity:0} 31.5% {opacity:.8} 32.6% {opacity:0} 100% {opacity:0}
      }
      .barGlow { animation-name: barGlow; }
      @keyframes barGlow { 0%,45% {opacity:.55} 50%,92% {opacity:0} 96%,100% {opacity:.55} }
      .offLabel { animation-name: offLabel; }
      @keyframes offLabel { 0%,50% {opacity:0} 55%,90% {opacity:1} 94%,100% {opacity:0} }

      /* Power switch */
      .knob { animation-name: knob; animation-timing-function: ease-in-out; }
      @keyframes knob { 0%,42% {transform:translateX(0)} 46%,92% {transform:translateX(-44px)} 96%,100% {transform:translateX(0)} }
      .trackOn { animation-name: trackOn; }
      @keyframes trackOn { 0%,42% {opacity:1} 46%,92% {opacity:0} 96%,100% {opacity:1} }
      .labelOn { animation-name: trackOn; }
      .labelOff { animation-name: labelOff; }
      @keyframes labelOff { 0%,42% {opacity:0} 46%,92% {opacity:1} 96%,100% {opacity:0} }

      /* Cursor clicks the switch */
      .cursor { animation-name: cursor; animation-timing-function: ease-in-out; }
      @keyframes cursor {
        0%,25% {transform:translate(120px,80px); opacity:0}
        30% {transform:translate(120px,80px); opacity:1}
        40% {transform:translate(0,0)} 43% {transform:translate(0,0) scale(.85)} 45% {transform:translate(0,0) scale(1)}
        52% {transform:translate(0,0); opacity:1} 58%,100% {transform:translate(60px,60px); opacity:0}
      }

      /* Ghost touches hitting the blacked-out bar */
      .ripple { animation-name: none; transform-box: fill-box; transform-origin: center; opacity: 0; }
      .r1 { animation-name: ripple1; } .r2 { animation-name: ripple2; } .r3 { animation-name: ripple3; }
      @keyframes ripple1 { 0%,60% {opacity:0; transform:scale(.3)} 60.5% {opacity:1; transform:scale(.3)} 67% {opacity:0; transform:scale(2.6)} 100% {opacity:0} }
      @keyframes ripple2 { 0%,70% {opacity:0; transform:scale(.3)} 70.5% {opacity:1; transform:scale(.3)} 77% {opacity:0; transform:scale(2.6)} 100% {opacity:0} }
      @keyframes ripple3 { 0%,80% {opacity:0; transform:scale(.3)} 80.5% {opacity:1; transform:scale(.3)} 87% {opacity:0; transform:scale(2.6)} 100% {opacity:0} }

      .c0 { animation-name: c0; } .c1 { animation-name: c1; } .c2 { animation-name: c2; } .c3 { animation-name: c3; }
      @keyframes c0 { 0%,49% {opacity:0} 52%,60.4% {opacity:1} 60.5%,100% {opacity:0} }
      @keyframes c1 { 0%,60.4% {opacity:0} 60.5%,70.4% {opacity:1} 70.5%,100% {opacity:0} }
      @keyframes c2 { 0%,70.4% {opacity:0} 70.5%,80.4% {opacity:1} 80.5%,100% {opacity:0} }
      @keyframes c3 { 0%,80.4% {opacity:0} 80.5%,91% {opacity:1} 94%,100% {opacity:0} }
      .counterBox { animation-name: counterBox; }
      @keyframes counterBox { 0%,49% {opacity:0} 52%,91% {opacity:1} 94%,100% {opacity:0} }
      .flickerTag { animation-name: flickerTag; }
      @keyframes flickerTag { 0%,40% {opacity:1} 46%,92% {opacity:0} 96%,100% {opacity:1} }

      @media (prefers-reduced-motion: reduce) { .cycle { animation: none !important; } }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="400" rx="24" fill="url(#bg)"/>
  <rect width="960" height="400" rx="24" fill="url(#glow)"/>

  <!-- Laptop keyboard deck -->
  <rect x="90" y="96" width="780" height="330" rx="26" fill="url(#deck)"/>
  <rect x="90" y="96" width="780" height="330" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <!-- key rows -->
  <g fill="#111111">
    <rect x="130" y="196" width="50" height="46" rx="7"/><rect x="186" y="196" width="50" height="46" rx="7"/>
    <rect x="242" y="196" width="50" height="46" rx="7"/><rect x="298" y="196" width="50" height="46" rx="7"/>
    <rect x="354" y="196" width="50" height="46" rx="7"/><rect x="410" y="196" width="50" height="46" rx="7"/>
    <rect x="466" y="196" width="50" height="46" rx="7"/><rect x="522" y="196" width="50" height="46" rx="7"/>
    <rect x="578" y="196" width="50" height="46" rx="7"/><rect x="634" y="196" width="50" height="46" rx="7"/>
    <rect x="690" y="196" width="50" height="46" rx="7"/><rect x="746" y="196" width="84" height="46" rx="7"/>
    <rect x="130" y="250" width="76" height="46" rx="7"/><rect x="212" y="250" width="50" height="46" rx="7"/>
    <rect x="268" y="250" width="50" height="46" rx="7"/><rect x="324" y="250" width="50" height="46" rx="7"/>
    <rect x="380" y="250" width="50" height="46" rx="7"/><rect x="436" y="250" width="50" height="46" rx="7"/>
    <rect x="492" y="250" width="50" height="46" rx="7"/><rect x="548" y="250" width="50" height="46" rx="7"/>
    <rect x="604" y="250" width="50" height="46" rx="7"/><rect x="660" y="250" width="50" height="46" rx="7"/>
    <rect x="716" y="250" width="50" height="46" rx="7"/><rect x="772" y="250" width="58" height="46" rx="7"/>
  </g>

  <!-- Touch Bar glow (only while on) -->
  <rect class="cycle barGlow" x="150" y="136" width="660" height="32" rx="12" fill="#6d9cfe" filter="url(#soft)"/>

  <!-- Touch Bar -->
  <rect x="128" y="126" width="704" height="52" rx="11" fill="url(#barEdge)"/>
  <rect x="130" y="128" width="700" height="48" rx="9" fill="#000"/>

  <g clip-path="url(#barClip)">
    <g class="cycle tbOn">
      <rect x="138" y="134" width="62" height="36" rx="7" fill="#303030"/>
      <text x="169" y="157" fill="#fff" font-size="14" text-anchor="middle">esc</text>
      <rect x="232" y="134" width="56" height="36" rx="7" fill="#303030"/>
      <path d="M264 144 l-8 8 8 8" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="294" y="134" width="56" height="36" rx="7" fill="#303030"/>
      <circle cx="322" cy="152" r="8" stroke="#fff" stroke-width="2.4" fill="none" stroke-dasharray="40 10"/>
      <rect x="356" y="134" width="210" height="36" rx="7" fill="#303030"/>
      <circle cx="402" cy="151" r="6" stroke="#fff" stroke-width="2" fill="none"/>
      <path d="M406.5 155.5 l5 5" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <text x="420" y="157" fill="#fff" font-size="14">Search or enter address</text>
      <rect x="572" y="134" width="56" height="36" rx="7" fill="#303030"/>
      <path d="M600 144 v16 M592 152 h16" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      <!-- Control strip -->
      <rect x="660" y="134" width="40" height="36" rx="7" fill="#303030"/>
      <circle cx="680" cy="152" r="6" fill="#e2b623"/>
      <rect x="704" y="134" width="40" height="36" rx="7" fill="#303030"/>
      <path d="M714 148 h5 l6 -5 v18 l-6 -5 h-5z" fill="#88bcff"/>
      <rect x="748" y="134" width="40" height="36" rx="7" fill="#303030"/>
      <rect x="764" y="143" width="8" height="13" rx="4" fill="#e496f6"/>
      <rect x="792" y="134" width="30" height="36" rx="7" fill="#303030"/>
    </g>
    <!-- glitch streaks -->
    <g class="cycle glitch">
      <rect x="130" y="141" width="700" height="3" fill="#fff" opacity=".8"/>
      <rect x="130" y="160" width="700" height="2" fill="#9be7ff" opacity=".7"/>
    </g>
    <text class="cycle offLabel" x="480" y="157" fill="#ffffff" fill-opacity="0.16" font-size="13" font-weight="600" letter-spacing="3" text-anchor="middle">TOUCH BAR OFF</text>
    <circle class="cycle ripple r1" cx="300" cy="152" r="10" fill="none" stroke="#ff9890" stroke-width="2.5"/>
    <circle class="cycle ripple r2" cx="690" cy="152" r="10" fill="none" stroke="#ff9890" stroke-width="2.5"/>
    <circle class="cycle ripple r3" cx="470" cy="152" r="10" fill="none" stroke="#ff9890" stroke-width="2.5"/>
  </g>

  <!-- "Flickering" tag -->
  <g class="cycle flickerTag">
    <rect x="404" y="62" width="152" height="30" rx="15" fill="#503424"/>
    <text x="480" y="82" fill="#ffb37e" font-size="13" font-weight="600" text-anchor="middle">⚡ flickering…</text>
  </g>

  <!-- Ghost-touch counter -->
  <g class="cycle counterBox">
    <rect x="356" y="58" width="248" height="34" rx="17" fill="#5b2b28"/>
    <text x="472" y="80" fill="#ffaea7" font-size="13" font-weight="600" text-anchor="middle">✋ ghost touches blocked:</text>
  </g>
  <g font-size="14" font-weight="700" fill="#ffaea7" text-anchor="middle">
    <text class="cycle c0" x="586" y="80">0</text>
    <text class="cycle c1" x="586" y="80">1</text>
    <text class="cycle c2" x="586" y="80">2</text>
    <text class="cycle c3" x="586" y="80">3</text>
  </g>

  <!-- App power switch (top-left) -->
  <g transform="translate(40 28)">
    <rect width="214" height="50" rx="12" fill="#1b1b1b" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="16" y="31" fill="#fff" font-size="15" font-weight="700">DisableBar</text>
    <g transform="translate(128 12)">
      <rect width="72" height="26" rx="13" fill="url(#offGrad)"/>
      <rect class="cycle trackOn" width="72" height="26" rx="13" fill="url(#onGrad)"/>
      <text class="cycle labelOn" x="16" y="18" fill="#111111" font-size="11" font-weight="700">ON</text>
      <text class="cycle labelOff" x="40" y="18" fill="#fff" font-size="11" font-weight="700">OFF</text>
      <g class="cycle knob"><circle cx="59" cy="13" r="10" fill="#e2e2e2"/><circle class="cycle trackOn" cx="59" cy="13" r="10" fill="#111111"/></g>
    </g>
  </g>

  <!-- Cursor -->
  <g transform="translate(222 58)">
    <g class="cycle cursor">
      <path d="M0 0 L0 20 L5 15 L9 24 L12.5 22.5 L8.5 14 L15 14 Z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
